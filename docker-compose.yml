services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3100:3000"
    environment:
      BACKEND_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3100}"
      NEXT_PUBLIC_MINIO_URL: "${NEXT_PUBLIC_MINIO_URL:-http://localhost:9100}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - public

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8100:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      MINIO_SECURE: "${MINIO_SECURE:-false}"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-15}"
      REFRESH_TOKEN_EXPIRE_DAYS: "${REFRESH_TOKEN_EXPIRE_DAYS:-7}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3100}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3100}"
      EMAIL_VERIFICATION_EXPIRE_HOURS: "${EMAIL_VERIFICATION_EXPIRE_HOURS}"
      PASSWORD_RESET_EXPIRE_MINUTES: "${PASSWORD_RESET_EXPIRE_MINUTES}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USERNAME: "${SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_ENCRYPTION: "${SMTP_ENCRYPTION}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL}"
      WHATSAPP_ENABLED: "${WHATSAPP_ENABLED:-false}"
      WHATSAPP_DRY_RUN: "${WHATSAPP_DRY_RUN:-false}"
      WHATSAPP_API_VERSION: "${WHATSAPP_API_VERSION:-v21.0}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
      WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN:-}"
      WHATSAPP_DEFAULT_COUNTRY_CODE: "${WHATSAPP_DEFAULT_COUNTRY_CODE:-591}"
      WHATSAPP_TEMPLATE_LANG: "${WHATSAPP_TEMPLATE_LANG:-es}"
      WHATSAPP_TEMPLATE_OTP: "${WHATSAPP_TEMPLATE_OTP:-codigo_verificacion}"
      WHATSAPP_TEMPLATE_ADMIN_NEW_RESERVATION: "${WHATSAPP_TEMPLATE_ADMIN_NEW_RESERVATION:-admin_nueva_reserva}"
      WHATSAPP_TEMPLATE_ADMIN_VOUCHER_UPLOADED: "${WHATSAPP_TEMPLATE_ADMIN_VOUCHER_UPLOADED:-admin_comprobante_subido}"
      WHATSAPP_TEMPLATE_RESERVATION_APPROVED: "${WHATSAPP_TEMPLATE_RESERVATION_APPROVED:-reserva_aprobada}"
      WHATSAPP_TEMPLATE_RESERVATION_REJECTED: "${WHATSAPP_TEMPLATE_RESERVATION_REJECTED:-reserva_rechazada}"
      WHATSAPP_TEMPLATE_PAYMENT_RECEIVED: "${WHATSAPP_TEMPLATE_PAYMENT_RECEIVED:-pago_recibido}"
      WHATSAPP_TEMPLATE_PAYMENT_CONFIRMED: "${WHATSAPP_TEMPLATE_PAYMENT_CONFIRMED:-pago_confirmado}"
      WHATSAPP_BUSINESS_NUMBER: "${WHATSAPP_BUSINESS_NUMBER:-}"
      WHATSAPP_VERIFY_TOKEN: "${WHATSAPP_VERIFY_TOKEN:-}"
      WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET:-}"
      OTP_EXPIRE_MINUTES: "${OTP_EXPIRE_MINUTES:-10}"
      OTP_MAX_ATTEMPTS: "${OTP_MAX_ATTEMPTS:-5}"
      OTP_RESEND_COOLDOWN_SECONDS: "${OTP_RESEND_COOLDOWN_SECONDS:-60}"
      OTP_MAX_SENDS_PER_HOUR: "${OTP_MAX_SENDS_PER_HOUR:-5}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      COOKIE_SAMESITE: "${COOKIE_SAMESITE:-lax}"
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"
      TRUSTED_HOSTS: "${TRUSTED_HOSTS:-*}"
      SECURITY_HEADERS_ENABLED: "${SECURITY_HEADERS_ENABLED:-true}"
      HSTS_ENABLED: "${HSTS_ENABLED:-false}"
      HSTS_MAX_AGE: "${HSTS_MAX_AGE:-31536000}"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - public
      - internal

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal
      - public

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  minio_data:
